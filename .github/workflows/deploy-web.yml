name: Deploy Web

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/config/**"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/types/**"
      - "packages/config/**"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Ensure INTERNAL_API_URL is set in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          API_URL="https://grc-api-staging-641269528478.us-central1.run.app"
          # Upsert the env var for both production and preview — ignore errors if it already exists
          for target in production preview; do
            curl -sf -X POST "https://api.vercel.com/v10/projects/${VERCEL_PROJECT_ID}/env" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"key\":\"INTERNAL_API_URL\",\"value\":\"${API_URL}\",\"type\":\"plain\",\"target\":[\"${target}\"]}" \
              || true
          done

      - name: Deploy to Vercel
        id: deploy
        run: |
          url=$(vercel deploy \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes)
          echo "url=$url" >> $GITHUB_OUTPUT

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 Preview deployed: ${{ steps.deploy.outputs.url }}`
            })
