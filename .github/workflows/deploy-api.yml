name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/types/**"
      - "packages/config/**"
  workflow_dispatch:

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY }}/api
  # Job-level so the Sentry upload step's if: condition can read it
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build & Deploy API to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm turbo build --filter=@grc/api

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -f apps/api/Dockerfile \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Build and push migrate image
        run: |
          MIGRATE_IMAGE=${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY }}/migrate
          docker build --platform linux/amd64 -f apps/api/Dockerfile.migrate \
            -t ${MIGRATE_IMAGE}:${{ github.sha }} \
            -t ${MIGRATE_IMAGE}:latest .
          docker push ${MIGRATE_IMAGE}:${{ github.sha }}
          docker push ${MIGRATE_IMAGE}:latest
          gcloud run jobs update grc-migrate-staging \
            --image ${MIGRATE_IMAGE}:${{ github.sha }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Apply Prisma migrations via Cloud Run Job (VPC access)
        run: |
          gcloud run jobs execute grc-migrate-staging \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --wait

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_API_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            REDIS_URL=redis://10.104.22.115:6379
          flags: >-
            --min-instances=1 --max-instances=20 --port=3001
            --set-secrets=DATABASE_URL=grc-database-url-staging:latest,CLERK_SECRET_KEY=grc-clerk-secret-key-staging:latest,CLERK_WEBHOOK_SIGNING_SECRET=grc-clerk-webhook-secret-staging:latest,SENTRY_DSN=grc-sentry-dsn-staging:latest

      - name: Upload Sentry source maps
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          pnpm dlx @sentry/cli releases \
            --org ${{ vars.SENTRY_ORG }} \
            --project ${{ vars.SENTRY_PROJECT_API }} \
            files ${{ github.sha }} \
            upload-sourcemaps apps/api/dist \
            --url-prefix '~/dist'
